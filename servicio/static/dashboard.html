<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recomendador de productos</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 720px; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; }
    .salud { font-size: 0.9rem; margin-bottom: 1.5rem; }
    .ok { color: #1a7f37; font-weight: 600; }
    .error { color: #b42318; font-weight: 600; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input[type=text], input[type=password] { flex: 1; padding: 0.5rem; font-size: 1rem; }
    input[type=number] { width: 4.5rem; padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; padding: 0.4rem 0.6rem; text-align: left; }
    th { background: #f5f5f5; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    #mensaje { margin: 0.75rem 0; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>Recomendador de productos</h1>
  <div class="salud">Estado del servicio: <span id="salud">consultando…</span></div>

  <form id="formulario">
    <input type="password" id="clave" placeholder="Clave API (X-API-Key)" autocomplete="off" required>
    <input type="text" id="usuario" placeholder="user_id, p. ej. AFNT6ZJCYQN3WDIKUSWHJDXNND2Q" required>
    <input type="number" id="n" value="5" min="1" max="100" title="Cantidad de recomendaciones (1-100)">
    <button type="submit">Recomendar</button>
  </form>

  <div id="mensaje"></div>
  <table>
    <thead>
      <tr><th>#</th><th>parent_asin</th><th class="num">score</th></tr>
    </thead>
    <tbody id="resultados"></tbody>
  </table>

  <script>
    const salud = document.getElementById("salud");
    const mensaje = document.getElementById("mensaje");
    const tbody = document.getElementById("resultados");

    async function cargarSalud() {
      try {
        const r = await fetch("/salud");
        const cuerpo = await r.json();
        salud.textContent = r.ok ? cuerpo.estado : "HTTP " + r.status;
        salud.className = r.ok ? "ok" : "error";
      } catch (e) {
        salud.textContent = "sin conexión";
        salud.className = "error";
      }
    }

    document.getElementById("formulario").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const usuario = document.getElementById("usuario").value.trim();
      const n = document.getElementById("n").value;
      tbody.replaceChildren();
      mensaje.className = "";
      mensaje.textContent = "Consultando…";
      try {
        const url = "/recomendar?usuario=" + encodeURIComponent(usuario) + "&n=" + encodeURIComponent(n);
        const clave = document.getElementById("clave").value;
        const r = await fetch(url, { headers: { "X-API-Key": clave } });
        const cuerpo = await r.json();
        if (!r.ok) {
          mensaje.className = "error";
          mensaje.textContent = typeof cuerpo.detail === "string" ? cuerpo.detail : "Error HTTP " + r.status;
          return;
        }
        mensaje.textContent = "Modelo: " + cuerpo.modelo + " · usuario: " + cuerpo.usuario;
        cuerpo.recomendaciones.forEach((rec, i) => {
          const fila = document.createElement("tr");
          const celdas = [String(i + 1), rec.parent_asin, rec.score.toFixed(4)];
          celdas.forEach((texto, c) => {
            const td = document.createElement("td");
            td.textContent = texto;
            if (c === 2) td.className = "num";
            fila.appendChild(td);
          });
          tbody.appendChild(fila);
        });
      } catch (e) {
        mensaje.className = "error";
        mensaje.textContent = "No se pudo consultar el servicio";
      }
    });

    cargarSalud();
  </script>
</body>
</html>
